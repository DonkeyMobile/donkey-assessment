# SwiftLint for DonkeyDiscover.
# Strict, but only the rules that matter for an app of this size.

included:
  - DonkeyDiscover
  - DonkeyDiscoverTests

excluded:
  - DerivedData
  - .build

disabled_rules:
  - todo
  # Trailing commas are allowed and Xcode handles indentation.
  - indentation_width
  - trailing_comma
  - opening_brace

opt_in_rules:
  # Performance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_first_last

  # Safety
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unowned_variable_capture

  # Consistency
  - attributes
  - closure_spacing
  - collection_alignment
  - convenience_type
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - toggle_bool
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

  # Cleanup
  - array_init
  - empty_collection_literal
  - overridden_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - unneeded_parentheses_in_closure_argument

# Violations are warnings in Xcode, so previews keep building.
strict: false

line_length:
  warning: 100
  ignores_urls: true
  ignores_comments: true

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 400
  error: 600

cyclomatic_complexity:
  warning: 8
  error: 15

multiline_arguments:
  first_argument_location: next_line
  only_enforce_after_first_closure_on_first_line: true

attributes:
  always_on_line_above:
    - '@ViewBuilder'
  always_on_same_line:
    - '@Environment'
    - '@State'
    - '@Binding'
    - '@ObservationIgnored'
    - '@MainActor'
    - '@objc'

identifier_name:
  min_length: 3
  excluded:
    - id
    - url
    - xs
    - sm
    - md
    - lg
    - xl
    - xxs
    - xxl

custom_rules:
  english_only_in_comments:
    name: 'English only in comments'
    # Code and comments are English. German belongs in product copy only.
    regex: '(?i)(?<![A-Za-z])(nicht|oder|und|wird|werden|sind|keine|dass|weil|damit|für|wenn|dann|eine|einen|diese|dieser|noch|schon|immer|hier)(?![A-Za-z])'
    match_kinds: [comment, doccomment]
    message: 'Comments are English.'
    severity: warning

  raw_color_literal:
    name: 'Raw color'
    # Colors come from the asset catalog through ColorName, so light/dark
    # and a rebrand stay in one place.
    regex: '\b(Color|UIColor)\s*(\.\s*(white|black|gray|red|green|blue|orange|yellow|pink|purple|brown)\b|\(\s*(red|hue|white)\s*:)'
    excluded_match_kinds: [comment, doccomment]
    excluded: '.*/Theme/.*'
    message: 'Use Theme.color(_:), never a raw color.'
    severity: warning

  font_without_theme:
    name: 'Font outside the theme'
    # Fonts go through ThemeTypo so Dynamic Type and the brand fonts stay consistent.
    regex: '(Font\.custom|UIFont\(name:|\.font\(\.system|UIFont\.systemFont)'
    excluded_match_kinds: [comment, doccomment]
    # The theme defines the fonts; the theme tests check they are registered.
    excluded: '.*/(Theme|DonkeyDiscoverTests)/.*'
    message: 'Use ThemeTypo (.themed(_:) or .uiFont()), never a font directly.'
    severity: warning

  manager_service_helper_naming:
    name: 'Manager, Service or Helper in a type name'
    # These words name no responsibility. Name what the type does.
    regex: '\b(struct|class|enum|protocol|actor)\s+\w*(Manager|Service|Helper)\b'
    excluded_match_kinds: [comment, doccomment]
    message: 'Name the responsibility, not Manager/Service/Helper.'
    severity: warning

  dispatch_main_async_after:
    name: 'DispatchQueue.main.asyncAfter'
    regex: 'DispatchQueue\.main\.asyncAfter'
    message: 'Use Task.sleep(for:), which can be cancelled.'
    severity: warning

reporter: xcode
